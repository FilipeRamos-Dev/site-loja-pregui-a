            </ul>
        </div>
    </header>

    <main class="container">
        <section class="secao">
            <h2>Formulário</h2>

            <form class="formulario" action="#" method="post">
                <fieldset>
                    <legend>Identificação</legend>
                    <div class="campo-formulario">
                        <label for="nome">Nome Completo</label>
                        <input 
                            type="text" 
                            id="nome" 
                            name="nome" 
                            placeholder="Digite seu nome" 
                            minlength="3" 
                            maxlength="80" 
                            required
                        >
                    </div>
                    <div class="campo-formulario">
                        <label for="email">E-mail:</label>
                        <input 
                            type="email"
                            id="email"
                            name="email"
                            placeholder="email@exemple.com"
                            required
                        >
                    </div>
                    <div class="campo-formulario">
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone">
                    </div>
                    <div class="campo-formulario">
                        <label for="endereco">Endereço</label>
                        <input type="url" name="site" id="site" placeholder="">
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Sobre a encomenda</legend>
                    <div class="campo-formulario">
                        <label for="assunto">Produto:</label>
                        <select name="assunto" id="assunto">
                            <option value="">Selecione</option>
                            <option value="colchao">Colchão de camomila</option>
                            <option value="trav">Nuvem travesseiro</option>
                            <option value="poltrona">Poltrona Massageadora</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>

                    <div class="campo-formulario">
                        <label for="empresa">Entrega:</label>

                        <input 
                            type="text"
                            id="tipo-entrega"
                            name="entrega"
                            list="entrega-sugerida"
                        >

                    </div>
                    
                    <!-- div.nome_da_div*quantidade(ex: 3) -->
                </fieldset>
                <fieldset>
                    <legend>Avaliação do site:</legend>

                    <div class="campo-formulario">
                        <label for="mensagem">Escreva sua mensagem:</label>
                        <textarea 
                            name="mensagem" 
                            id="mensagem"
                            rows="8"
                            minlength="10"
                            maxlength="1000"
                            placeholder="Escreva aqui sua avaliação..."
                            required
                        ></textarea>
                    </div>
                </fieldset>
                <div class="acoes-formulario">
                    <button type="submit">Enviar</button>
                    <button type="submit">Limpar</button>
                </div>
            </form>
        </section>
    </main>
