<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Filipe Ramos">
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/style-encomenda.css">
</head>
<body>
    <header class="cabecalho">
        <div class="container">
            <p class="etiqueta">Portfólio</p>

            <h1>PREGUIMY: Uma boa preguiça</h1>

            <nav class="menu-principal">
                <ul class="menu-lista">
                    <li><a class="menu-link" href="../index.html">Home</a></li>
                    <li><a class="menu-link" href="./planos.html">Projetos</a></li>
                    <li><a class="menu-link" href="./encomenda.html">Encomenda</a></li>
                    <li><a class="menu-link" href="./livros.html">Livros</a></li>
                </ul>   
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="secao">
            <h2>Formulário</h2>

            <form class="formulario" action="#" method="post">
                <fieldset>
                    <legend>Identificação</legend>
                    <div class="campo-formulario">
                        <label for="nome">Nome Completo</label>
                        <input 
                            type="text" 
                            id="nome" 
                            name="nome" 
                            placeholder="Digite seu nome" 
                            minlength="3" 
                            maxlength="80" 
                            required
                        >
                    </div>
                    <div class="campo-formulario">
                        <label for="email">E-mail:</label>
                        <input 
                            type="email"
                            id="email"
                            name="email"
                            placeholder="email@exemple.com"
                            required
                        >
                    </div>
                    <div class="campo-formulario">
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone">
                    </div>
                    <div class="campo-formulario">
                        <label for="endereco">Endereço</label>
                        <input type="url" name="site" id="site" placeholder="">
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Sobre a encomenda</legend>
                    <div class="campo-formulario">
                        <label for="assunto">Produto:</label>
                        <select name="assunto" id="assunto">
                            <option value="">Selecione</option>
                            <option value="projeto">Colchão de camomila</option>
                            <option value="oportunidade">Nuvem travesseiro</option>
                            <option value="educacao"></option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>

                    <div class="campo-formulario">
                        <label for="empresa">Empresa:</label>

                        <input 
                            type="text"
                            id="empresa"
                            name="empresa"
                            list="empresa-sugerida"
                        >

                        <details id="empresa-sugerida">
                            <option value="Empresa de Tecnologia">
                            <option value="Instituição do Ensino">
                            <option value="Consultoria">
                        </details>
                    </div>
                    <p>Tipo de Contato</p>
                    <p>
                    <input 
                        type="radio"
                        id="profissional"
                        name="tipo-contato"
                        value="profissional"    
                    >
                    <label for="profissional">Profissional</label>
                    <input 
                        type="radio"
                        name="tipo-contato"
                        id="academico"
                        value="academico"
                    >
                    <label for="academico">Acadêmico</label>
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Preferências</legend>
                    <div class="campo-formulario">
                        <label for="data">Data preferid para retorno:</label>
                        <input type="date" id="data" name="data">
                    </div>

                    <div class="campo-formulario">
                        <label for="horario">Horario prefirido:</label>
                        <input type="time" name="horario" id="horario">
                    </div>
                    
                    <div class="campo-formulario">
                        <label for="urgencia">Urgencia de 1 a 5</label>
                        <input 
                            type="range"
                            id="urgencia"
                            name="urgencia"
                            min="1"
                            max="5"
                            value="4"
                        >
                    </div>
                    <div class="campo-formulario">
                        <label for="cor">Escolha a cor:</label>
                        <input type="color" name="cor" id="cor" value="#2563ff">
                    </div>
                    <div class="campo-formulario">
                        <label for="arquivo">Anexar arquivo:</label>
                        <input 
                            type="text"
                            id="arquivo"
                            name="arquivo"
                            accept=".pdf, .doc, .docx"
                        >
                    </div>
                    <!-- div.nome_da_div*quantidade(ex: 3) -->
                </fieldset>
                <fieldset>
                    <legend>Mensagem:</legend>

                    <div class="campo-formulario">
                        <label for="mensagem">Escreva sua mensagem:</label>
                        <textarea 
                            name="mensagem" 
                            id="mensagem"
                            rows="8"
                            minlength="10"
                            maxlength="1000"
                            placeholder="Escreva aqui..."
                            required
                        ></textarea>
                    </div>
                </fieldset>
                <div class="acoes-formulario">
                    <button type="submit">Enviar</button>
                    <button type="submit">Limpar</button>
                </div>
            </form>
        </section>
    </main>

</body>
</html>
